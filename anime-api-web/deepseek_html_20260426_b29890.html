<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeKu API - Nonton Anime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">AnimeKu</div>
    <nav>
      <a href="#" id="homeLink">Home</a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari anime...">
        <button id="searchBtn">Cari</button>
      </div>
    </nav>
  </header>

  <section class="hero">
    <h1>Selamat Datang di AnimeKu</h1>
    <p>Database anime terlengkap dari seluruh dunia</p>
  </section>

  <main class="anime-list">
    <h2 id="listTitle">Anime Terpopuler</h2>
    <div class="grid" id="animeGrid">
      <!-- Kartu anime akan dimuat di sini oleh JavaScript -->
    </div>
    <div class="pagination">
      <button id="loadMoreBtn">Muat Lebih Banyak</button>
    </div>
  </main>

  <!-- Modal untuk Detail Anime -->
  <div id="animeModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modalDetails">
        <!-- Detail akan diisi oleh JavaScript -->
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 AnimeKu. Data dari Jikan API.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
