<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeKu - Nonton Anime Sub Indo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="logo">🎬 AnimeKu</div>
    <nav>
      <a href="#" id="homeLink">🏠 Home</a>
      <a href="#" id="trendingLink">🔥 Trending</a>
      <a href="#" id="popularLink">⭐ Populer</a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari anime...">
        <button id="searchBtn">🔍</button>
      </div>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>AnimeKu</h1>
    <p>Nonton anime favoritmu gratis subtitle Indonesia</p>
  </section>

  <!-- KONTEN -->
  <main>
    <!-- DAFTAR ANIME -->
    <section class="anime-section" id="animeSection">
      <h2 id="listTitle">🔥 Trending Anime</h2>
      <div class="grid" id="animeGrid"></div>
      <div class="pagination">
        <button id="prevPageBtn" style="display:none;">⬅ Sebelumnya</button>
        <span id="pageInfo"></span>
        <button id="nextPageBtn" style="display:none;">Selanjutnya ➡</button>
      </div>
    </section>

    <!-- DETAIL ANIME -->
    <section class="detail-section" id="detailSection" style="display:none;">
      <button class="back-btn" id="backBtn">⬅ Kembali</button>
      <div id="animeDetail"></div>
    </section>

    <!-- HALAMAN NONTON -->
    <section class="watch-section" id="watchSection" style="display:none;">
      <button class="back-btn" id="backFromWatchBtn">⬅ Kembali ke Detail</button>
      <div id="watchContainer"></div>
    </section>
  </main>

  <!-- LOADING -->
  <div class="loading-overlay" id="loadingOverlay" style="display:none;">
    <div class="spinner"></div>
    <p>Memuat...</p>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 AnimeKu. Data dari AniList API. Untuk pembelajaran.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
